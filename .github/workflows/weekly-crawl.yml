name: Job crawl
on:
  schedule:
    - cron: "17 11 * * *"     # every day 11:17 UTC (6:17 am Eastern): daily emails; weekly on Mondays, monthly on the 1st
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      # Optional: Indeed / LinkedIn / Google Jobs feed and the "not on LinkedIn/Indeed" check
      JOBSEARCH_PROVIDER: ${{ secrets.JOBSEARCH_PROVIDER }}
      JOBSEARCH_API_KEY: ${{ secrets.JOBSEARCH_API_KEY }}
      JOBSEARCH_SCOPE: ${{ secrets.JOBSEARCH_SCOPE }}
      JOBSPY_SITES: ${{ secrets.JOBSPY_SITES }}
      JOBSPY_PROXIES: ${{ secrets.JOBSPY_PROXIES }}
      JOBSPY_MAX_COMPANIES: ${{ secrets.JOBSPY_MAX_COMPANIES }}
      # Optional: newsletter / blog destinations
      BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
      BUTTONDOWN_SEND: ${{ secrets.BUTTONDOWN_SEND }}
      WP_URL: ${{ secrets.WP_URL }}
      WP_USER: ${{ secrets.WP_USER }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      WP_STATUS: ${{ secrets.WP_STATUS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install JobSpy (only used when JOBSEARCH_PROVIDER is jobspy)
        if: ${{ env.JOBSEARCH_PROVIDER == 'jobspy' }}
        run: pip install python-jobspy
      - name: Crawl job boards (US jobs only)
        run: python3 crawler/crawl.py
      - name: Write digest and publish to newsletter / WordPress (if configured)
        run: python3 crawler/publish.py
      - name: Commit updated data
        run: |
          git config user.name "jobs-crawler"
          git config user.email "jobs-crawler@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Job crawl $(date -u +%Y-%m-%d)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: "." }
      - uses: actions/deploy-pages@v4
